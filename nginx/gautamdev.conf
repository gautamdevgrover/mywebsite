# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION FOR GAUTAM DEV PLATFORM
# Domain: gautamdevgrover.online (and www.gautamdevgrover.online)
# Upstream: Next.js application container listening on 127.0.0.1:3000
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP Server (Port 80)
# Before SSL: Passes traffic to application.
# After Certbot: Certbot will automatically configure HTTPS redirect here.
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name gautamdevgrover.online www.gautamdevgrover.online;

    client_max_body_size 10M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Let's Encrypt ACME Challenge verification directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Reverse proxy to local Next.js application container
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Cache static Next.js assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }
}

