<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Near-black background with subtle dark teal tint -->
    <linearGradient id="gd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E14"/>
      <stop offset="50%" stop-color="#060A0E"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>
    
    <!-- Thin green/teal accent border gradient -->
    <linearGradient id="gd-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="40%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Subtle accent glow for dot -->
    <linearGradient id="gd-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Very subtle glow only around border and accent -->
    <filter id="borderGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="accentGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Square Background with Subtle Dark Teal Tint -->
  <rect x="12" y="12" width="488" height="488" rx="104" fill="url(#gd-bg)"/>

  <!-- Subtle Outer Border Glow -->
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="url(#gd-border)" stroke-width="14" stroke-opacity="0.3" filter="url(#borderGlow)"/>

  <!-- Crisp Thin Green/Teal Border -->
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="url(#gd-border)" stroke-width="10" stroke-opacity="0.9"/>

  <!-- Bold Clean White GD Letters in Center -->
  <g fill="#FFFFFF">
    <text x="254" y="316" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="900" 
          font-size="236" 
          letter-spacing="-6">GD</text>
  </g>

  <!-- Small Subtle Teal/Green Accent Element Integrated in Lower-Middle Area -->
  <circle cx="254" cy="366" r="16" fill="url(#gd-accent)" filter="url(#accentGlow)"/>
  <circle cx="254" cy="366" r="8.5" fill="#E6FFFA"/>
</svg>